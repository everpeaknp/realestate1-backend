services:
  # Backend Web Service
  - type: web
    name: realestate-backend
    runtime: docker
    plan: free
    healthCheckPath: /admin/login/
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: realestate-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "false"
      - key: ALLOWED_HOSTS
        value: "*"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://realestate-frontend.onrender.com"

  # Frontend Web Service
  - type: web
    name: realestate-frontend
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: "20.x"
      - key: NEXT_PUBLIC_API_URL
        fromService:
          name: realestate-backend
          type: web
          property: host

databases:
  - name: realestate-db
    plan: free
